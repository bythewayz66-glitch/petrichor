name: Token Push Probe

# TEMPORARY. This workflow exists only to answer one question empirically:
# can the Actions GITHUB_TOKEN push to this repository, and does it need an
# explicit `permissions: contents: write`? It is deleted immediately after
# the run. It pushes only to throwaway branches, never to main.

on:
  workflow_dispatch:

jobs:
  probe-default:
    name: Push with default token permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attempt push to a throwaway branch
        run: |
          set +e
          git config user.email "probe@example.invalid"
          git config user.name "probe"
          git checkout -b probe/token-default
          echo "probe" > .token-probe-default
          git add .token-probe-default
          git commit -m "probe: default token permissions"
          git push origin probe/token-default 2>&1 | tail -20
          echo "PUSH_EXIT=${PIPESTATUS[0]}"

  probe-write:
    name: Push with contents write
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attempt push to a throwaway branch
        run: |
          set +e
          git config user.email "probe@example.invalid"
          git config user.name "probe"
          git checkout -b probe/token-write
          echo "probe" > .token-probe-write
          git add .token-probe-write
          git commit -m "probe: contents write"
          git push origin probe/token-write 2>&1 | tail -20
          echo "PUSH_EXIT=${PIPESTATUS[0]}"
